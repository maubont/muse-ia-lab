name: Desplegar backend (InsForge)

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'functions/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      INSFORGE_CREDENTIALS: ${{ secrets.INSFORGE_CREDENTIALS }}
      INSFORGE_PROJECT_ID: ${{ secrets.INSFORGE_PROJECT_ID }}
      INSFORGE_ORG_ID: da15b50d-ff22-43f7-8042-f75b9b509c3e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Autenticar CLI de InsForge
        run: |
          mkdir -p ~/.insforge
          printf '%s' "$INSFORGE_CREDENTIALS" > ~/.insforge/credentials.json
          npx --yes @insforge/cli whoami
          npx --yes @insforge/cli link --project-id "$INSFORGE_PROJECT_ID" --org-id "$INSFORGE_ORG_ID" -y --json

      - name: Aplicar migraciones pendientes
        run: npx --yes @insforge/cli db migrations up --all

      - name: Desplegar edge functions
        run: |
          for f in functions/*.ts; do
            slug=$(basename "$f" .ts)
            echo "── Desplegando $slug ──"
            npx --yes @insforge/cli functions deploy "$slug" --file "$f"
          done
